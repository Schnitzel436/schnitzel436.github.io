<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShareFlow</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="scene">
    <canvas id="bgCanvas" class="bg-canvas"></canvas>
    
    <div class="nature-overlay">
      <svg class="leaf-scatter" viewBox="0 0 1200 800" preserveAspectRatio="none">
        <defs>
          <filter id="soft-blur">
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" />
          </filter>
        </defs>
        <path class="leaf" d="M 0 0 Q 10 5 15 15 Q 12 10 0 0" filter="url(#soft-blur)" style="--delay: 0s; --duration: 8s" />
        <path class="leaf" d="M 0 0 Q 10 5 15 15 Q 12 10 0 0" filter="url(#soft-blur)" style="--delay: 2s; --duration: 9s" />
        <path class="leaf" d="M 0 0 Q 10 5 15 15 Q 12 10 0 0" filter="url(#soft-blur)" style="--delay: 4s; --duration: 10s" />
        <circle class="orb-bg" cx="15%" cy="20%" r="100" filter="url(#soft-blur)" />
        <circle class="orb-bg" cx="85%" cy="75%" r="80" filter="url(#soft-blur)" />
      </svg>
    </div>

    <div class="content-wrapper">
      <header class="header-zone">
        <div class="header-content">
          <h1 class="logo-text">ShareFlow</h1>
          <p class="tagline">Smooth file sharing</p>
        </div>
      </header>

      <main class="main-grid">
        <div class="upload-zone">
          <div class="dropzone" id="dropzone">
            <input id="fileInput" type="file" multiple hidden>
            
            <div class="lightning-orb">
              <div class="orb-core"></div>
              <div class="orb-glow"></div>
              <svg class="lightning-bolt" viewBox="0 0 20 40" preserveAspectRatio="xMidYMid meet">
                <path d="M 10 2 L 6 15 L 12 15 L 8 38 L 14 20 L 8 20 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>

            <div class="upload-text-zone">
              <h2 class="upload-title">Upload Files</h2>
              <p class="upload-hint">Drag or click to add</p>
            </div>

            <button class="upload-button" id="browseButton" type="button">Choose</button>
          </div>

          <div class="info-cards">
            <div class="info-card">
              <span class="card-label">Files</span>
              <span class="card-value" id="stat-files">0</span>
            </div>
            <div class="info-card">
              <span class="card-label">Size</span>
              <span class="card-value" id="stat-size">0 MB</span>
            </div>
            <button class="clear-btn" id="clearFiles" type="button">Clear All</button>
          </div>
        </div>

        <div class="files-zone">
          <div class="files-container" id="filesDisplay">
            <div class="no-files">No files yet</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
